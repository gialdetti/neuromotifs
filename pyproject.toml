[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuromotifs"
version = "0.1.0a3"
description = "Geometry-aware network motif analysis for neocortical microcircuits"
readme = "README.md"
authors = [
  {name = "Eyal Gal"},
  {name = "Rodrigo Perin"},
  {name = "Henry Markram"},
  {name = "Michael London"},
  {name = "Idan Segev"},
]
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
keywords = ["neuroscience", "motifs", "networks", "geometry", "microcircuit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.3",
  "h5py",
  "joblib",
  "netsci>=0.0.4",
  "typer",
]

[project.optional-dependencies]
dev = ["jupyter", "ipywidgets", "pytest"]

[project.urls]
Homepage = "https://github.com/gialdetti/neuromotifs"
Issues = "https://github.com/gialdetti/neuromotifs/issues"

[project.scripts]
neuromotifs = "neuromotifs.cli:app"

[tool.setuptools.package-data]
neuromotifs = ["data/*.md", "data/**/*.npz", "data/**/*.csv.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
include-package-data = true